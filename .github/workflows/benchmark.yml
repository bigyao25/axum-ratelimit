name: Axum High-load Benchmarks
on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'High-load comparison (4 CPUs), operational smoke, or microbenchmarks'
        required: true
        default: compare
        type: choice
        options: [compare, smoke, micro, diagnose]
      full_matrix:
        description: 'Run all nine client/mode combinations instead of five representative cases'
        required: false
        default: true
        type: boolean
      backends:
        description: 'Backend shards to run'
        required: true
        default: both
        type: choice
        options: [both, memory, redis]
      targets:
        description: 'Optional single-backend follow-ups: CLIENTS:MODE:RPS separated by spaces'
        required: false
        default: ''
        type: string
      report_run:
        description: 'Optional existing run ID: rebuild its reports without generating load'
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}-${{ inputs.backends }}-${{ inputs.report_run && 'report' || 'benchmark' }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test benchmark tooling once
        run: python3 -W error::ResourceWarning -m unittest discover -s benchmarks/tests -v
      - name: Plan backend shards
        id: matrix
        env:
          BENCHMARK_SUITE: ${{ inputs.suite }}
          BENCHMARK_SELECTION: ${{ inputs.backends }}
          BENCHMARK_TARGETS: ${{ inputs.targets }}
          BENCHMARK_REPORT_RUN: ${{ inputs.report_run }}
        run: |
          read -r -a targets <<< "$BENCHMARK_TARGETS"
          python3 benchmarks/workflow.py plan --suite "$BENCHMARK_SUITE" --backends "$BENCHMARK_SELECTION" --targets "${targets[@]}" --report-run "$BENCHMARK_REPORT_RUN" --github-output
  benchmark:
    if: inputs.suite != 'micro' && !inputs.report_run
    name: Benchmark (${{ matrix.shard }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.full_matrix && 240 || 180 }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build, probe and confirm on the same runner
        id: benchmark
        env:
          BENCHMARK_SUITE: ${{ inputs.suite }}
          BENCHMARK_BACKENDS: ${{ matrix.backends }}
          BENCHMARK_FULL_MATRIX: ${{ inputs.full_matrix }}
          BENCHMARK_TARGETS: ${{ inputs.targets }}
        run: |
          mkdir -p benchmarks/results/ci
          set -euo pipefail
          if [ "$BENCHMARK_SUITE" = diagnose ]; then
            python3 benchmarks/diagnose.py --backend "$BENCHMARK_BACKENDS" --output benchmarks/results/ci 2>&1 | tee benchmarks/results/ci/run.log
            exit 0
          fi
          if [ "$BENCHMARK_SUITE" = compare ]; then
            options=()
            if [ -n "$BENCHMARK_TARGETS" ]; then
              read -r -a targets <<< "$BENCHMARK_TARGETS"
              options+=(--targets "${targets[@]}")
            elif [ "$BENCHMARK_FULL_MATRIX" = true ]; then
              options+=(--full-matrix)
            fi
            python3 benchmarks/campaign.py --backend "$BENCHMARK_BACKENDS" "${options[@]}" --output benchmarks/results/ci 2>&1 | tee benchmarks/results/ci/run.log
            exit 0
          else
            resource=ci
            variants=(baseline head governor ratelimit)
            read -r -a backends <<< "$BENCHMARK_BACKENDS"
          fi
          python3 benchmarks/bench.py "$BENCHMARK_SUITE" --resources "$resource" --variants "${variants[@]}" --backends "${backends[@]}" --output benchmarks/results/ci 2>&1 | tee benchmarks/results/ci/run.log
      - name: Record shard outcome
        if: always()
        env:
          BENCHMARK_STATUS: ${{ steps.benchmark.outcome }}
        run: python3 benchmarks/workflow.py status benchmarks/results/ci --outcome "$BENCHMARK_STATUS"
      - name: Generate assessment even on failure
        if: always()
        env:
          BENCHMARK_STATUS: ${{ steps.benchmark.outcome }}
        run: python3 benchmarks/summary.py benchmarks/results/ci --status "$BENCHMARK_STATUS" --output benchmarks/results/ci/assessment.md
      - name: Upload reports and raw diagnostics
        id: artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-diagnostics-${{ matrix.shard }}
          path: benchmarks/results/ci/
          retention-days: 14
          if-no-files-found: warn
      - name: Publish workflow assessment
        if: always()
        env:
          BENCHMARK_STATUS: ${{ steps.benchmark.outcome }}
          BENCHMARK_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: python3 benchmarks/summary.py benchmarks/results/ci --status "$BENCHMARK_STATUS" --output benchmarks/results/ci/assessment.md --github-summary
  micro:
    if: inputs.suite == 'micro'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run explicit in-process microbenchmarks
        run: |
          mkdir -p benchmarks/results/micro
          set -euo pipefail
          cargo bench --locked --no-default-features --bench memory 2>&1 | tee benchmarks/results/micro/memory.log
          cargo bench --locked --no-default-features --bench middleware 2>&1 | tee benchmarks/results/micro/middleware.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-micro
          path: benchmarks/results/micro/
          retention-days: 14
  overview:
    name: Collect backend reports
    needs: [prepare, benchmark]
    if: ${{ always() && needs.prepare.result == 'success' && inputs.suite != 'micro' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: benchmark-diagnostics-*
          path: benchmarks/results/shards
          merge-multiple: false
          run-id: ${{ inputs.report_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Index independent measurements
        if: always()
        env:
          BENCHMARK_SUITE: ${{ inputs.suite }}
          BENCHMARK_SELECTION: ${{ inputs.backends }}
          BENCHMARK_REPORT_RUN: ${{ inputs.report_run }}
        run: python3 benchmarks/workflow.py aggregate benchmarks/results/shards --suite "$BENCHMARK_SUITE" --backends "$BENCHMARK_SELECTION" --measurement-run "$BENCHMARK_REPORT_RUN" --output benchmarks/results/overview --github-summary
      - name: Upload workflow overview
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-overview
          path: benchmarks/results/overview/
          retention-days: 14
