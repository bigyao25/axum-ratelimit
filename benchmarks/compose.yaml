services:
  redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    command: [redis-server, --save, '', --appendonly, 'no', --maxmemory, 256mb, --maxmemory-policy, noeviction, --slowlog-log-slower-than, '${REDIS_SLOWLOG_THRESHOLD:-10000}']
    cpus: ${REDIS_CPUS:-1}
    cpuset: ${REDIS_CPUSET:-3}
    mem_limit: 512m
    memswap_limit: 512m
    stop_grace_period: 2s
    pids_limit: 64
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 1s
      timeout: 1s
      retries: 30
  server:
    image: ${SERVER_IMAGE}
    cpus: ${SERVER_CPUS:-2}
    cpuset: ${SERVER_CPUSET:-1,2}
    mem_limit: 1g
    memswap_limit: 1g
    stop_grace_period: 2s
    pids_limit: 128
    environment:
      VARIANT: ${VARIANT}
      BACKEND: ${BACKEND}
      LIMIT: ${LIMIT}
      WINDOW: ${WINDOW}
      WORKERS: ${WORKERS:-2}
      DIAGNOSTICS: ${DIAGNOSTICS:-0}
    depends_on:
      redis:
        condition: service_healthy
  loadgen:
    image: ${LOADGEN_IMAGE:-axum-ratelimit-bench-loadgen:local}
    cpus: ${LOADGEN_CPUS:-1}
    cpuset: ${LOADGEN_CPUSET:-0}
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 600
    environment:
      PHASE_BARRIER: ${PHASE_BARRIER:-0}
      LIMIT: ${LIMIT}
      RATE: ${RATE}
      CONCURRENCY: ${CONCURRENCY}
      CLIENTS: ${CLIENTS}
      DURATION: ${DURATION}
      WARMUP: ${WARMUP}
      ADMISSION_POLICY: ${ADMISSION_POLICY:-wait}
      REUSE_WARMUP_POOL: ${REUSE_WARMUP_POOL:-1}
      DIAGNOSTICS: ${DIAGNOSTICS:-0}
    depends_on: [server]
networks:
  default:
    internal: true
