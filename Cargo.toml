[package]
name = "axum-ratelimit"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["bigyao25 <rungroo@gmail.com>"]
description = "Exact sliding-window rate limiting for Axum, with atomic memory and Redis backends"
license = "MIT"
repository = "https://github.com/bigyao25/axum-ratelimit"
readme = "README.md"
keywords = ["ratelimit", "axum", "tower", "redis", "middleware"]
categories = ["web-programming", "security"]
include = [
    "src/**", "examples/**", "tests/**", "benches/**",
    "Cargo.toml", "Cargo.lock", "README*.md", "CHANGELOG.md", "LICENSE",
]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
tower-layer = "0.3"
tower-service = "0.3"
http = "1"
futures-util = "0.3"
dashmap = "6"
log = "0.4"
redis = { version = "1.8", optional = true, default-features = false, features = [
    "tokio-comp", "connection-manager", "script",
] }
tokio = { version = "1", optional = true, features = ["time"] }

[features]
default = ["redis"]
redis = ["dep:redis", "dep:tokio"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
tower = { version = "0.5", features = ["util", "limit"] }
http-body = "1"
bytes = "1"

[[example]]
name = "redis"
required-features = ["redis"]

[[bench]]
name = "memory"
harness = false
test = false

[[bench]]
name = "middleware"
harness = false
test = false

[lints.rust]
unsafe_code = "forbid"

[package.metadata.docs.rs]
all-features = true
